<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Header with JS</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Custom Styling for Scroll Effect */
        .navbar {
            transition: all 0.3s ease-in-out;
        }
        .navbar.scrolled {
            background-color: #212529 !important;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        body {
            height: 2000px; /* Page scroll check karne ke liye */
        }
    </style>
</head>
<body>

    <!-- Header / Navbar Start -->
    <nav id="mainNavbar" class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top px-4">
        <div class="container-fluid">
            <!-- Brand Logo -->
            <a class="navbar-brand fw-bold" href="#">MyWebsite</a>

            <!-- Mobile Toggle Button -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navigation Links -->
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-center">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Services</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Contact</a>
                    </li>
                    <li class="nav-item ms-lg-3 mt-2 mt-lg-0">
                        <button class="btn btn-outline-light btn-sm" id="alertBtn">Click Me</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <!-- Header End -->

    <!-- Bootstrap 5 JS Bundle CDN (Navbar toggle ke liye zaroori hai) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JavaScript -->
    <script>
        // 1. Scroll Effect: Jab user page ko scroll kare ga toh navbar ka style change hoga
        window.addEventListener('scroll', function () {
            const navbar = document.getElementById('mainNavbar');
            if (window.scrollY > 50) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });

        // 2. Button Click Event: Header ke andar button par click karne par alert show hoga
        document.getElementById('alertBtn').addEventListener('click', function () {
            alert('Aapne header ka button click kiya hai!');
        });
    </script>
    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Section</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* Hero Section Custom Styles */
        .hero-section {
            position: relative;
            min-height: 90vh;
            /* Aap apni image ka path lagayein */
            background: url('https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=1920&q=80') center center/cover no-repeat;
            display: flex;
            align-items: center;
        }

        /* Dark Overlay for better text readability */
        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.55);
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 2;
        }

        .sub-title {
            letter-spacing: 2px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .main-heading {
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1.2;
        }

        /* Rounded Blue Button */
        .btn-custom {
            background-color: #0077b6;
            color: #ffffff;
            border-radius: 25px;
            padding: 10px 28px;
            font-weight: 500;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-custom:hover {
            background-color: #023e8a;
            color: #ffffff;
        }

        /* Custom Dots at Bottom */
        .hero-dots {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            display: flex;
            gap: 8px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #ffffff;
            cursor: pointer;
            opacity: 0.9;
        }

        .dot.active {
            background-color: #0077b6;
        }

        @media (max-width: 768px) {
            .main-heading {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>

    <!-- Hero Section Start -->
    <section class="hero-section text-white">
        <!-- Overlay -->
        <div class="hero-overlay"></div>

        <div class="container hero-content">
            <div class="row">
                <div class="col-lg-7 col-md-9 ms-md-4">
                    <!-- Sub Heading -->
                    <p class="sub-title text-uppercase mb-2">WELCOME TO CONSOLUTION</p>
                    
                    <!-- Main Title -->
                    <h1 class="main-heading mb-4">We Are The Best<br>Consulting Agency</h1>
                    
                    <!-- Button -->
                    <a href="#" class="btn btn-custom">Our Services</a>
                </div>
            </div>
        </div>

        <!-- Carousel Dots -->
        <div class="hero-dots">
            <span class="dot"></span>
            <span class="dot active"></span>
        </div>
    </section>
    <!-- Hero Section End -->

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
